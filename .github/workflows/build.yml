name: Build signed arm64 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # 运行器已预装 Android SDK，这里只需接受许可协议，让 AGP 能自动下载 platform 37
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # 签名：优先使用仓库 Secrets 里的固定密钥（每次构建签名一致，可覆盖安装）。
      # 没配置 Secrets 时临时生成一个密钥，能装但每次签名不同，更新需先卸载旧版。
      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            STORE_PW="$SECRET_STORE_PASSWORD"; ALIAS="$SECRET_KEY_ALIAS"; KEY_PW="${SECRET_KEY_PASSWORD:-$SECRET_STORE_PASSWORD}"
            echo "Using keystore from secrets"
          else
            echo "::warning::未配置签名 Secrets，使用临时密钥，每次构建签名都不同"
            STORE_PW="$(openssl rand -hex 12)"; ALIAS="aoita"; KEY_PW="$STORE_PW"
            keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 4096 \
              -validity 36500 -storepass "$STORE_PW" -keypass "$KEY_PW" \
              -dname "CN=Aoita, O=Aoita, C=CN"
          fi
          {
            echo "KEYSTORE_FILE=$KS"
            echo "KEYSTORE_PASSWORD=$STORE_PW"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$STORE_PW"

      - name: Build release + debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Verify signature and ABI
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          echo "--- native libs in APK ---"
          unzip -l "$APK" | grep "lib/" || true
          if unzip -l "$APK" | grep -E "lib/(armeabi-v7a|x86|x86_64)/" ; then
            echo "::error::APK 中出现了非 arm64-v8a 的库"; exit 1
          fi
          cp "$APK" Aoita-arm64-v8a-release.apk
          cp app/build/outputs/apk/debug/*.apk Aoita-arm64-v8a-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aoita-arm64-v8a
          path: |
            Aoita-arm64-v8a-release.apk
            Aoita-arm64-v8a-debug.apk
          if-no-files-found: error
